<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Title and description for accessibility -->
  <title>Prism Logo Full</title>
  <desc>Prism app logo with lens icon and text, in amber color</desc>
  
  <!-- Logo Icon -->
  <g id="logo-icon">
    <!-- Outer circle -->
    <circle cx="60" cy="60" r="38" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
    
    <!-- Inner lens -->
    <circle cx="60" cy="60" r="16" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="60" cy="60" r="12" fill="#FEF3C7" opacity="0.6"/>
    
    <!-- Focus rays (8-point star pattern) -->
    <!-- Top -->
    <line x1="60" y1="35" x2="60" y2="18" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <!-- Top-right -->
    <line x1="79" y1="41" x2="90" y2="30" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <!-- Right -->
    <line x1="85" y1="60" x2="102" y2="60" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <!-- Bottom-right -->
    <line x1="79" y1="79" x2="90" y2="90" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <!-- Bottom -->
    <line x1="60" y1="85" x2="60" y2="102" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <!-- Bottom-left -->
    <line x1="41" y1="79" x2="30" y2="90" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <!-- Left -->
    <line x1="35" y1="60" x2="18" y2="60" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
    <!-- Top-left -->
    <line x1="41" y1="41" x2="30" y2="30" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Text: Prism -->
  <text x="130" y="75" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="48" font-weight="600" fill="#111827" letter-spacing="-0.5">Prism</text>
</svg>
