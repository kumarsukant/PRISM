<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Title and description for accessibility -->
  <title>Prism Logo Icon</title>
  <desc>Prism app icon - lens with focus rays in amber color</desc>
  
  <!-- Background (optional, for app icon) -->
  <!-- Uncomment if needed for app store -->
  <!-- <rect width="200" height="200" fill="#FEF3C7" rx="40"/> -->
  
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#F59E0B" stroke-width="5"/>
  
  <!-- Inner lens -->
  <circle cx="100" cy="100" r="32" fill="none" stroke="#F59E0B" stroke-width="4"/>
  <circle cx="100" cy="100" r="24" fill="#FEF3C7" opacity="0.6"/>
  
  <!-- Focus rays (8-point star pattern) -->
  <!-- Top -->
  <line x1="100" y1="50" x2="100" y2="16" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <!-- Top-right -->
  <line x1="131" y1="69" x2="158" y2="42" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <!-- Right -->
  <line x1="150" y1="100" x2="184" y2="100" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <!-- Bottom-right -->
  <line x1="131" y1="131" x2="158" y2="158" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <!-- Bottom -->
  <line x1="100" y1="150" x2="100" y2="184" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <!-- Bottom-left -->
  <line x1="69" y1="131" x2="42" y2="158" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <!-- Left -->
  <line x1="50" y1="100" x2="16" y2="100" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <!-- Top-left -->
  <line x1="69" y1="69" x2="42" y2="42" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
</svg>
